services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gfs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gfs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gfs_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfs} -d ${POSTGRES_DB:-gfs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: gfs-api
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gfs}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-gfs}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: gfs-frontend
    profiles: ["app"]
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  gfs_pgdata:
