services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gfs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-gfs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gfs_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfs} -d ${POSTGRES_DB:-gfs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gfs_pgdata:
